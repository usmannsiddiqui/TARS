<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="none">
<!-- An original flat scene: a lamp-lit bone concrete slab with blueprint line-work, a charcoal machinery
     seam, a far face in teal shadow, a ledge, and a flat cloud bank far below. No gradients, no glow.
     TARS stands on the ledge at 80% across, 22.7% up (positioned in CSS); the stencil is HTML text. -->
<rect width="400" height="300" fill="#1A2523"/>
<!-- far face in shadow, with faint panel joints -->
<rect x="318" y="0" width="82" height="300" fill="#22302D"/>
<path d="M318 64h82M318 150h82M358 0v232" stroke="#2C3B38" stroke-width="1"/>
<!-- machinery seam -->
<rect x="244" y="0" width="74" height="232" fill="#101716"/>
<g fill="#1C2624">
<rect x="250" y="10" width="18" height="30"/><rect x="272" y="18" width="12" height="14"/><rect x="290" y="6" width="22" height="20"/>
<rect x="252" y="52" width="10" height="44"/><rect x="266" y="60" width="24" height="10"/><rect x="296" y="40" width="16" height="36"/>
<rect x="250" y="112" width="26" height="16"/><rect x="282" y="98" width="10" height="40"/><rect x="298" y="120" width="14" height="22"/>
<rect x="254" y="150" width="12" height="30"/><rect x="270" y="170" width="20" height="12"/><rect x="296" y="160" width="16" height="44"/>
</g>
<g fill="#26322F">
<rect x="254" y="14" width="10" height="3"/><rect x="292" y="10" width="18" height="2"/><rect x="268" y="64" width="20" height="2"/>
<rect x="252" y="116" width="22" height="2"/><rect x="272" y="174" width="16" height="2"/><rect x="298" y="44" width="12" height="2"/>
</g>
<!-- cloud bank far below: flat stepped haze -->
<path d="M0 300V262c18-6 30-4 44-9 14-6 26-3 40-7 16-5 30 2 46-4 14-5 28-1 42-6 18-6 34 1 50-5 16-6 30 0 46-6 14-5 30 1 44-4 16-5 30 0 46-5 14-4 28 1 42-3V300Z" fill="#33413E"/>
<path d="M0 300V276c20-4 34 0 52-5 18-4 32 1 50-4 16-4 34 2 50-3 18-5 36 1 54-4 18-4 34 2 52-3 16-4 34 1 50-3 18-4 30 1 42-2V300Z" fill="#46524D"/>
<path d="M0 300V288c24-3 44 1 66-2 22-3 44 1 66-2 24-3 46 1 70-2 22-3 44 1 66-2 22-2 46 1 66-1 22-2 44 1 66-1V300Z" fill="#5C645D"/>
<!-- the bone slab: lamp-lit concrete, its shaded thickness on the right -->
<rect x="0" y="0" width="236" height="250" fill="#CDC1AB"/>
<rect x="236" y="0" width="8" height="250" fill="#8C8270"/>
<!-- weathering: flat streaks a tone darker -->
<g fill="#C2B59D">
<rect x="34" y="140" width="5" height="110"/><rect x="88" y="0" width="3" height="96"/><rect x="176" y="142" width="7" height="90"/>
<rect x="206" y="8" width="4" height="70"/><rect x="128" y="196" width="18" height="4"/>
</g>
<!-- panel joints -->
<path d="M0 140h236M120 140v110" stroke="#B2A68F" stroke-width="1.4"/>
<!-- blueprint line-work printed on the panel -->
<g fill="none" stroke="#9D927F" stroke-width=".6">
<rect x="14" y="14" width="208" height="118"/>
<path d="M150 14v118M150 52h72M150 92h72M186 52v80M14 112h136"/>
<path d="M160 28h52M160 34h40M160 40h46"/>
<path d="M22 124h120M22 120v8M142 120v8M82 121v6"/>
<circle cx="186" cy="72" r="10"/><path d="M176 72h20M186 62v20"/>
<rect x="196" y="98" width="20" height="28"/><path d="M196 106h20M196 114h20"/>
<rect x="14" y="154" width="92" height="78"/>
<path d="M14 176h92M14 198h92M48 154v78M78 154v78"/>
<path d="M134 156h88v68h-88zM134 214h88M150 156v58"/>
<path d="M160 224v14M160 238h60"/>
</g>
<!-- a service hatch -->
<rect x="150" y="166" width="48" height="14" fill="#2C2A25"/>
<rect x="153" y="169" width="42" height="8" fill="#191815"/>
<!-- small plate of fine print, too small to read: texture, not text -->
<g fill="#8E8472"><rect x="160" y="190" width="30" height="2"/><rect x="160" y="195" width="22" height="1.4"/><rect x="160" y="199" width="26" height="1.4"/></g>
<!-- the ledge TARS stands on, jutting out over the drop -->
<rect x="196" y="232" width="164" height="9" fill="#D9CEB9"/>
<rect x="196" y="241" width="164" height="7" fill="#958A77"/>
<rect x="196" y="248" width="164" height="3" fill="#3A3832"/>
<path d="M214 236h4M246 236h4M278 236h4M310 236h4M342 236h4" stroke="#BDB19C" stroke-width="1"/>
</svg>
